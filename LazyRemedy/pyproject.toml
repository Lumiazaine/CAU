[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lazyremedy"
version = "1.0.0"
description = "API wrapper dual (FastAPI REST + FastMCP) sobre BMC Remedy User v7.0.01 (CAU Justicia)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Proyecto interno CAU Justicia" }
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "fastmcp>=3.0",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["lazyremedy*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
